services:
  sql-portal:
    environment:
      KRB5_CONFIG: /etc/krb5.conf
      SQLPORTAL_KERBEROS_KEYTAB: /run/secrets/sqlportal.keytab
    volumes:
      - type: bind
        source: "${SQLPORTAL_KRB5_CONFIG_PATH:?Set SQLPORTAL_KRB5_CONFIG_PATH in .env}"
        target: /etc/krb5.conf
        read_only: true
      - type: bind
        source: "${SQLPORTAL_KEYTAB_PATH:?Set SQLPORTAL_KEYTAB_PATH in .env}"
        target: /run/secrets/sqlportal.keytab
        read_only: true
