apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-portal
  labels:
    app.kubernetes.io/name: sql-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sql-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sql-portal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: registry.example.internal/dba/sql-portal:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sql-portal
            - secretRef:
                name: sql-portal-secrets
                optional: true
          env:
            - name: KRB5_CONFIG
              value: /etc/sqlportal-kerberos/krb5.conf
            - name: SQLPORTAL_KERBEROS_KEYTAB
              value: /run/secrets/sqlportal.keytab
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kerberos-config
              mountPath: /etc/sqlportal-kerberos
              readOnly: true
            - name: kerberos-keytab
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kerberos-config
          configMap:
            name: sql-portal-kerberos
            optional: true
        - name: kerberos-keytab
          secret:
            secretName: sql-portal-kerberos
            optional: true

