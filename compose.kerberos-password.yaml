services:
  sql-portal:
    environment:
      KRB5_CONFIG: /etc/krb5.conf
      SQLPORTAL_KERBEROS_PASSWORD_FILE: /run/secrets/sqlportal.password
    volumes:
      - type: bind
        source: "${SQLPORTAL_KRB5_CONFIG_PATH:?Set SQLPORTAL_KRB5_CONFIG_PATH in .env}"
        target: /etc/krb5.conf
        read_only: true
      - type: bind
        source: "${SQLPORTAL_PASSWORD_FILE_PATH:?Set SQLPORTAL_PASSWORD_FILE_PATH in .env}"
        target: /run/secrets/sqlportal.password
        read_only: true
